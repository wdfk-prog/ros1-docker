# UKF 对照配置：与默认 EKF 使用相同输入契约，只替换滤波核心。
# Noetic ukf_localization_node 的 alpha/kappa/beta 默认值保持官方默认，便于只比较算法实现差异。
frequency: 30.0
sensor_timeout: 0.20

two_d_mode: true

transform_time_offset: 0.0
transform_timeout: 0.0
print_diagnostics: true
publish_tf: true
publish_acceleration: false

map_frame: map
odom_frame: odom
base_link_frame: base_link
world_frame: odom

# UKF sigma-point scaling parameters. Keep the documented defaults for this tutorial.
alpha: 0.001
kappa: 0.0
beta: 2.0

odom0: /odom/raw
odom0_config: [false, false, false,
               false, false, false,
               true,  false, false,
               false, false, false,
               false, false, false]
odom0_queue_size: 10
odom0_differential: false
odom0_relative: false

imu0: /imu/data_raw
imu0_config: [false, false, false,
              false, false, false,
              false, false, false,
              false, false, true,
              false, false, false]
imu0_queue_size: 10
imu0_differential: false
imu0_relative: false
imu0_remove_gravitational_acceleration: false
