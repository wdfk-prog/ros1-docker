# 对照配置：只使用 wheel odometry 的 vx 与 vyaw，不接入 IMU。
# 该 profile 用来区分“单一里程计状态估计”和“轮速 + IMU 接口融合”。
frequency: 30.0
sensor_timeout: 0.20
two_d_mode: true

transform_time_offset: 0.0
transform_timeout: 0.0
print_diagnostics: true
publish_tf: true
publish_acceleration: false

map_frame: map
odom_frame: odom
base_link_frame: base_link
world_frame: odom

odom0: /odom/raw
odom0_config: [false, false, false,
               false, false, false,
               true,  false, false,
               false, false, true,
               false, false, false]
odom0_queue_size: 10
odom0_differential: false
odom0_relative: false
