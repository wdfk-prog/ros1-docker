# 两套 costmap 共用机器人外形与实时障碍物观测配置。
# footprint 覆盖 0.60 m 车体长度以及左右轮的实际外廓宽度。
footprint: [[0.30, 0.28], [0.30, -0.28], [-0.30, -0.28], [-0.30, 0.28]]
footprint_padding: 0.02

obstacle_layer:
  enabled: true
  observation_sources: laser_scan_sensor
  laser_scan_sensor:
    sensor_frame: laser_link
    data_type: LaserScan
    topic: /scan
    marking: true
    clearing: true
    inf_is_valid: true
    obstacle_range: 4.5
    raytrace_range: 6.0
    min_obstacle_height: 0.0
    max_obstacle_height: 2.0

inflation_layer:
  enabled: true
  inflation_radius: 0.55
  cost_scaling_factor: 3.0
