DWAPlannerROS:
  # 第 15 章 robot_localization 的输出，而不是默认 /odom。
  odom_topic: /odometry/filtered

  # 差速底盘只采样 x 方向平移和 z 轴旋转速度。
  max_vel_x: 0.35
  min_vel_x: 0.0
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_trans: 0.35
  min_vel_trans: 0.05
  max_vel_theta: 0.80
  min_vel_theta: 0.20

  acc_lim_x: 0.60
  acc_lim_y: 0.0
  acc_lim_theta: 1.20
  acc_lim_trans: 0.60

  # 接近目标时用来判断机器人是否已经基本停稳。
  trans_stopped_vel: 0.02
  theta_stopped_vel: 0.05

  xy_goal_tolerance: 0.10
  yaw_goal_tolerance: 0.10
  latch_xy_goal_tolerance: false

  sim_time: 1.5
  vx_samples: 10
  vy_samples: 1
  vth_samples: 20

  path_distance_bias: 32.0
  goal_distance_bias: 20.0
  occdist_scale: 0.05
  forward_point_distance: 0.325
  stop_time_buffer: 0.20

  prune_plan: true
  publish_traj_pc: true
  publish_cost_grid_pc: true
