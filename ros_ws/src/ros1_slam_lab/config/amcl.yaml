# AMCL 只定位，不建图。map_server 提供地图，AMCL 负责 map -> odom。
use_map_topic: false
first_map_only: true

global_frame_id: map
odom_frame_id: odom
base_frame_id: base_link
tf_broadcast: true
transform_tolerance: 0.20

odom_model_type: diff
odom_alpha1: 0.10
odom_alpha2: 0.10
odom_alpha3: 0.10
odom_alpha4: 0.10
odom_alpha5: 0.10

min_particles: 100
max_particles: 1000
kld_err: 0.02
kld_z: 0.99
resample_interval: 2

update_min_d: 0.05
update_min_a: 0.05

laser_model_type: likelihood_field
laser_max_beams: 60
laser_min_range: -1.0
laser_max_range: -1.0
laser_z_hit: 0.95
laser_z_rand: 0.05
laser_sigma_hit: 0.20
laser_likelihood_max_dist: 2.0

# 仿真初始位置与地图坐标一致，先让第一次定位路径最简单。
initial_pose_x: 0.0
initial_pose_y: 0.0
initial_pose_a: 0.0
initial_cov_xx: 0.10
initial_cov_yy: 0.10
initial_cov_aa: 0.0685
